 id: 51
 name: "Dr."
 surname: "Michelle Yap Khai Khun"
 company: "Monash University Malaysia"
 title: "Senior Lecturer, School of Science"
 bio: "Dr. Michelle Yap is currently a senior lecturer and course coordinator for the Bachelor of Medical Bioscience and PASS Program coordinator, at the School of Science, Monash University Malaysia. She is dedicated to toxin pharmacology and toxicology research. She has strong background in biomolecular modelling, proteomics, immunological and molecular pharmacology of bioactive toxins. She leads the Toxin Pharmacology Research Group. Her research group now focuses on molecular mechanisms of cytotoxin with the ultimate goal of developing next-generation biotherapeutics. Her research works have been featured in prominent media outlets, including the International Snakebite Awareness Day campaign. Besides active in research, she is also an education innovator who adopts various active learning strategies with technology. She teaches undergraduate units with an emphasis on student-cantered learning using the andragogy approach. Dr. Michelle enjoys promoting STEM education to the public. She has organized and hosted several workshops and forums to advance the disciplines in medical sciences through research and education."
 thumbnailUrl: "MYKK.jpg"
-
 id: 52
 name: "Dr."
 surname: "Ng Chen Seng"
 company: "Monash University Malaysia"
 title: "Lecturer, School of Science"
 bio: "Dr. Ng Chen Seng is a Lecturer in the Division of Medical Biosciences, School of Science, at Monash University. He received his Bachelor of Science in Biotechnology from the University Malaysia Sabah in 2008 and went on to complete his Master and Doctorate of Science in Life Science from Kyoto University (Japan). Prior to joining Monash University, Dr. Ng conducted postdoctoral research at the University of California, Los Angeles, and the University of British Columbia. Dr. Ng has published numerous international peer-reviewed papers, many of which appear in leading journals, including the Cell Press iScience, Nature Press Cell Death and Differentiation, Autophagy, Journal of Virology, PLoS Pathogens, and etc. Notably, he identified interferon as the molecular signature in amyotrophic lateral sclerosis, a devastating motor neuron disease. This discovery could potentially serve as a therapeutic target or a diagnostic marker. His current research focuses on understanding the differences between mouse and human models."
 thumbnailUrl: "NCS.jpg"
