 name: "Dr."
 surname: "Tan Hock Siew"
 company: "Monash University Malaysia"
 title: "Senior Lecturer, School of Science"
 bio: "<p>Dr. Patrick Tan obtained his Honours degree from University Sains Malaysia in 2008 and went on to complete his Masters in Biotechnology in 2011. A year later, he secured a research fellowship to complete his doctoral work at the University of Wuerzburg in Germany. Dr. Tan was trained in the field of microbial genetics and biotechnology. His doctoral studies focused on understanding the role of small RNAs (sRNAs) in <ecm>Helicobacter pylori</ecm>, a human pathogen that causes gastric ulcer.<br><br>His goal is to contribute to betterment of our society through life science research and education. Besides work, Dr. Tan enjoys promoting STEM (science, technology, engineering, and mathematics) education to children and the public. He is also an avid photographer and a chess fan.</p>"
 thumbnailUrl: "Patrick.jpg"
-
 id: 54
 name: "Dr."
 surname: "Tan Ji Wei"
 company: "Monash University Malaysia"
 title: "Senior Lecturer, School of Science"
 bio: "Dr. Tan Ji Wei completed his BSc in 2011 (Biomedical Science), MSc in 2013 (Cell Biology) and PhD (Immunopharmacology) in 2016 from Universiti Putra Malaysia. Shortly after his PhD graduation, Dr. Tan was appointed to a lecturer position in the School of Science in January 2018. During his PhD study, he managed to develop a mast cell stabilizer from a synthetic compound originated from a natural plant. His current research interest is still focusing on the capabilities of natural products as an alternative treatment against various human ailments including allergic diseases, cancer, and neurodegenerative diseases. Specifically, he is exploring how a natural compound play its beneficial role within a cell by looking at the cellular and molecular signalling pathways."
 thumbnailUrl: "TJW.jpg"
-
 id: 55
 name: "Dr."
 surname: "Teng Suk Kuan"
 company: "Monash University Malaysia"
 title: "Teaching Fellow, School of Science"
 bio: "<p>Dr. Teng Suk Kuan obtained her BSc (Hons.) in Biology from Universiti Putra Malaysia (UPM) in 2008. She then continued her Master and Doctoral studies in environmental biology at the same institution. Her research was on earthworms and their application in plant disease remediation.  In 2016, she was awarded the Outstanding Postgraduate Award by the Science Faculty at UPM.<br><br>Prior to joining Monash, Suk Kuan was a lecturer at the School of Foundation Studies of Xiamen University Malaysia. She likes to interact with people and learn from them. She also enjoys seeing how biological knowledge can be applied in daily life. Suk Kuan supports sustainable living, she believes it is the key to address some major issues such as waste generation, depletion of natural resources and pollution.</p>"
 thumbnailUrl: "Teng.jpg"
-
 id: 56
 name: "Dr."
 surname: "Wee Wei Yee"
 company: "Monash University Malaysia"
 title: "Lecturer, School of Science"
 bio: "<p>Dr. Wei Yee Wee received his BSc in Bioinformatics from Multimedia University (MMU) in 2012. After graduation, he continue with his PhD in Bioinformatics in University of Malaya and continue to work as Post Doctoral Research Fellow under Centre for Research in Biotechnology for Agriculture (CEBAR), University of Malaya after he gained his PhD. He has gained many years of experience in the field of bioinformatics research. Currently, he is an assistant lecturer in the School of Sciences and engages in education and research through contribution to multidisciplinary research projects, research funding and research publication in ISI Journals. He has a proven record in publication and published around 24 high impact papers since 2012. He has also take part in setup, design, establishment and maintenance of new bioinformatics laboratory.<br><br>Dr. Wei Yee Wee has been involved in variety of Next Generation Sequencing (NGS) projects such as whole genome and transcriptome analysis on eukaryotic genomes, bacteria genome and metagenomics. He is familiar with Bioinformatics analysis such as genome assembly, genome annotation, genes comparative study, identification of SNP variants and prediction on the effect of the SNP variants, differential gene expression analysis, pan-genome analysis, phylogenetic tree analysis, prophage identification. He also develop useful Bioinformatics tools and pipelines such as the Pairwise Genome Comparison (PGC) and the Pathogenomics Profilling Tool (PathoProT). PGC is a bioinformatics tool which allow user to perform pairwise genome alignment and visualize the alignment in a circular layout and PathoProT allow user to screen for virulence genes in the genome. These 2 tools have been implemented and integrated into few published database such as VibrioBase and HelicoBase.<br><br>Dr. Wei Yee Wee current research projects are the whole genome analysis of <ecm>Mycobacterium cosmeticum</ecm> and transcriptomic analysis of <ecm>Bosenbergia rotunda</ecm>.</p>"
 thumbnailUrl: "Gavin.jpg"
-
 id: 57
 name: "Dr."
 surname: "Wong Siew Fang"
 company: "Monash University Malaysia"
 title: "Research Fellow, School of Science"
 bio: "<p>Dr. Wong Siew Fang assumed the role of a research fellow at Monash University Malaysia in August 2023. With a solid academic background, Dr. Wong holds a BSc degree (First Class Honors) in Resource Chemistry from Universiti Malaysia Sarawak (UNIMAS). He pursued his MSc and PhD studies at Universiti Sains Malaysia (USM) and Universiti Malaya (UM), respectively.<br><br>During his MSc studies, Dr. Wong concentrated on the synthesis mechanisms and catalytic applications of nanoporous zeolite materials, mentored by Assoc. Prof. Dr. Ng Eng Poh. He also gained valuable international research experience through a three-month research attachment at Suranaree University of Technology in Thailand, collaborating closely with Assoc. Prof. Dr. Jatuporn Wittayakun.<br><br>For his PhD, Dr. Wong conducted groundbreaking research in the field of differential-based optical biosensor arrays, guided by Assoc. Prof. Dr. Khor Sook Mei. His work aimed to detect, differentiate, and quantify various carcinogenic food contaminants in real food samples. Dr. Wong's research interests span across Analytical Chemistry, Bioanalytical Chemistry, Food Chemistry, Materials Chemistry, and Synthetic Chemistry, with a strong expertise in (bio)sensor array development and its application across various research domains.</p>"
 thumbnailUrl: "Wong.jpg"
-
 id: 58
 name: "Dr."
 surname: "Yeong Keng Yoon"
 company: "Monash University Malaysia"
 title: "Senior Lecturer, School of Science"
 bio: "<p>Dr. Keng Yoon Yeong (Ken) is currently a Senior Lecturer in the School of Science where he teaches Medicinal Chemistry and Advanced Organic Chemistry. Ken’s research focuses on medicinal chemistry with intersections to organic synthesis, biology and medicine. Broadly, the theme of Ken’s research group is targeted towards small molecule and short peptide drug discovery.<br><br>Before joining Monash University, Ken has spent 11 years as a research scientist in industry where he worked on small molecule organic synthesis and immunoassays. He has co-authored over 60 research publications in the field of medicinal chemistry and drug discovery. His group’s research activities are supported by supported by international as well as national funders such as the Royal Society of Chemistry UK, Malaysian Ministry of Science, Technology and Innovation (MOSTI) and Malaysian Ministry of Higher Education (MOHE). He is a co-inventor for several patent applications and is the recipient of numerous academic awards.</p>"
 thumbnailUrl: "YKY.jpg"
