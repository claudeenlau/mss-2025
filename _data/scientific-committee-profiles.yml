 bio: "Dr. Max's goal is to foster the next generation of young scientist. So that one day, they will be ready to carry on passing the torch of knowledge to the next generation. In 2010, he graduated from Monash University Malaysia, School of Science with Bachelor of Science (Medical Bioscience) (Hons). The next year, he was given the opportunity to pursue a doctoral degree in Monash University, Jeffrey Cheah School of Medicine and Health Sciences. He successfully obtained his doctoral degree in 2016."
