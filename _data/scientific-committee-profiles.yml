 id: 40
 name: "Dr."
 surname: "Adzzie Shazleen Azman"
 company: "Monash University Malaysia"
 title: "Lecturer, School of Science"
 bio: "<p>Dr. Adzzie Shazleen’s journey in microbiology began with a Bachelor of Science in Biotechnology (Hons) from Monash University in 2011, followed by a PhD in Microbiology, where she focused on discovering and characterizing novel rare Actinobacteria from mangroves. Her dedication led to remarkable findings, including the discovery of <em>Monashia flava</em>, a new genus named in honor of her alma mater, along with two new species of rare Actinobacteria.<br><br>After completing her PhD in 2016, Dr. Adzzie furthered her expertise as a Postdoctoral Research Fellow at the Universiti Malaya. She returned to Monash University as a lecturer in Microbiology in August 2020, where she continued her research on the bioactivities of Actinobacteria’s secondary metabolites, exploring their potential therapeutic applications.</p>"
 thumbnailUrl: "ASA.jpg"
