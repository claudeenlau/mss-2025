 id: 46
 name: "Dr."
 surname: "Foo Su Chern"
 company: "Monash University Malaysia"
 title: "Senior Lecturer, School of Science"
 bio: "<p>Dr.Foo Su Chern is on a mission to change the way people perceive and use microalgae. Prior to this, microalgae biomass was insufficiently characterised to enable full exploitation of the benefits as sustainable feedstock and ingredients for humans.<br><br>Her past research provided the tools and strategies to advance the understanding of microalgae uses. She unveiled microalgae's potential as antioxidant sources through food industry-driven research questions, while considering mounting concerns on the impacts of climate change via climate mitigation and adaptation strategies. This research vision aligns to UN SDG2.2, by introducing an alternative food biomass from aquatic sources with low carbon emission, highly nutritious and proven antioxidant properties.<br><br>Her on-going research will continue to provide innovative and sustainable bioactive ingredient to benefit food companies and end-users for health and well-being maintenance. </p>"
 thumbnailUrl: "FSC.jpg"
-
 id: 47
 name: "Dr."
 surname: "Krystle Angelique Santiago"
 company: "Monash University Malaysia"
 title: "Lecturer, School of Science"
 bio: "<p>Dr. Krystle Angelique Santiago joined Monash University Malaysia as a Research Fellow in January 2021. She earned her degree from the same university in June 2020. Her PhD focused on the diversity and biological properties of the lichen <em>Usnea</em> from Malaysia and the Philippines, and their associated endolichenic fungi. She also worked on metabolomics technology to identify the metabolic profiles of these organisms. Krystle has a strong interest in identifying biomarkers from fungi against infectious diseases and  agricultural diseases using metabolomics. Currently, she is working on the metabolomics analyses of Ganoderma-oil palm interactions, which is one of the current challenges on oil palm plantations in Malaysia."
 thumbnailUrl: "KAS.jpg"
-
 id: 48
 name: "Dr."
 surname: "Lee Sin Yee"
 company: "Monash University Malaysia"
 title: "Senior Teaching Fellow, School of Science"
 bio: "<p>In 2014, Dr. Sin Yee graduated from Universiti Putra Malaysia (UPM) with a major in Food Science and Technology. She was awarded by the faculty for her exemplary academic achievement and adoption of green technology in her final year project upon her graduation. Following that, she pursued her Doctor of Philosophy (PhD) degree in her alma mater in field of food technology.<br><br>She is a foodie. Food is her world. She loves walking down the aisles of grocery stores to see the new food products that are hitting the shelves while finding the ones that worth putting in her cart. She enjoys reading cookbook, cooking and baking in her free time because these habits could just spark her creativity on crazy food ideas, out of the blue.<br><br>She is deeply grateful and blessed for the rich learning environment that her teachers and lecturers had created for her in her learning path. The knowledge that they imparted to her has made her to believe in the value of knowledge sharing. To her, knowledge builds up on prior knowledge and it is never get isolated. Knowledge sharing helps her to get invaluable feedback from those more skilled or with different set of competences.</p>"
 thumbnailUrl: "SinYee.jpg"
-
 id: 49
 name: "Dr."
 surname: "Lee Yee Ying"
 company: "Monash University Malaysia"
 title: "Senior Lecturer, School of Science"
 bio: "Dr. Lee Yee Ying completed her Bachelors degree in 2010 and PhD in 2016 from Universiti Putra Malaysia in the area of Food Science and Technology. Through her PhD study, she managed to develop a type of functional oil through the enzymatic interesterification of the palm and palm kernel oil with potential to be used to manage obesity. Dr. Lee was appointed to a lecturer (level B) position in the School of Science in March 2017. Her research interests have broadened to focus on the chemical and enzymatic structural modification (esterification, transesterification, hydrolysis and glycerolysis) of edible fats and oils for the synthesis of functional lipid that can serve to manage and treat various health complications by understanding of the physicochemical properties of the fats and oils. Additionally, she is also fascinated to carry out in vivo studies to elucidate the health effect of structured lipids. Dr. Lee is also keen to utilize fats and oil in the development of food products, for instance beverage emulsion, mayonnaise, margarine, shortening, powdered oil and etc. She is also keen to venture on research related to palm oil processing and mitigation. Dr. Lee has published several peer review articles as well as one book chapter. She also presented several papers at local and international conferences."
 thumbnailUrl: "LYY.jpg"
