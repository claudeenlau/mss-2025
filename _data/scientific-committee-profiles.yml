  id: 42
  name: "Dr."
  surname: "Ashish Dutt"
  company: "Monash University Malaysia"
  title: "Lecturer, School of Science"
  bio: "Dr. Ashish Dutt is is currently a lecturer with the School of Science, Monash University Malaysia (MUM). He obtained his Bachelors in Science from Panjab University, Chandigarh, India. Post completing the bachelor's degree, he worked for a decade with top information technology companies in India like Dell and IBM. Basis of the rich industrial domain experience, he completed a Master's in Computer Science (CS) from Staffordshire University (Malaysia campus) and PhD in CS from University of Malaya. During his PhD, he focussed his research on mixed data clustering in the field of Educational Data Mining (EDM). He has published research papers in high impact journals in CS. He also serves as reviewer to several ISI and Scopus indexed journals in CS. Before joining Monash, he worked as a senior data scientist at Micron Technology, Penang, Malaysia where he developed video analytics based solutions for smart solid state drive manufacturing. "
  thumbnailUrl: "Ashish.jpg"
