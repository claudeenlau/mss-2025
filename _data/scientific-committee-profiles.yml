  id: 43
  name: "Dr."
  surname: "Aswini Leela"
  company: "Monash University Malaysia"
  title: "Research Fellow, School of Science"
  bio: "<p>Dr. Aswini did her Masters and PhD in Biotechnology at Biotechnology Research Institute, Universiti Malaysia Sabah. Her PhD project was on "Genetic diversity of the Green (Chelonia mydas) and Hawksbill (Erethmochelys imbricata) Turtles and the Prevalence of Chelonid Fibropapilloma-associated Herpesvirus (ChHV5) in Mabul Island Sabah, Malaysia" She brings with her experience and technical knowledge in solving problems related to Genetic, Microbiology, Histopathology and Bioinformatics among others. She has experience using next-gen sequencers such as Pacbio Sequencer and the Standard Sanger sequencer. Aswini joined Monash University Malaysia as a Research fellow in September 2020 and is working under the guidance of Prof. Qasim Ayub.<br><br>Currently, her research focus is generating high-quality reference-genome assemblies using high-throughput sequencing technology. Her aim is to draw attention to the conservation of endangered animals in Malaysia through genomics and contribute towards global efforts at bio-conservation. She is also responsible for generating a generalized bioinformatic pipeline that can be used for genome analysis such as mapping, assembly and variant calling pipeline for WGS. Her current projects at Monash are aligned to contribute towards the Vertebrate Genome Project (VGP) and the Earth BioGenome Project.</p>"
  thumbnailUrl: "Aswini.jpg"
-
  id: 44
  name: "Dr."
  surname: "Cheah Hong Leong"
  company: "Monash University Malaysia"
  title: "Research Fellow, School of Science"
  bio: "<p>Dr. Cheah Hong Leong has ten years of experience in microbiology, molecular biology, and bioinformatics, as well as seven years of experience as a translator of research writings. He also has a short history of working as a quality control microbiologist in the pharmaceutical industry. He earned his bachelor's degree from Universiti Tunku Abdul Rahman in 2011 and continued his postgraduate studies in molecular biology and bacteriology at Universiti Sains Malaysia, where he received his master's degree in 2014 and his PhD degree in 2022.<br><br>His doctoral research focused on RNA-seq analysis to establish the transcription start site landscape and small RNA profile of <ecm>Mycobacterium tuberculosis</ecm>. He also conducted a similar study on <ecm>Leptospira biflexa</ecm> as a side project. His studies have revealed the complexities of regulatory networks and sRNAome that contribute to the survival of these bacteria in hostile environments.<br><br>In January 2023, he joined Monash University Malaysia as a research fellow under the Malaysian BioGenome Project and has since shifted his research focus to conservation genomics. He is currently working on the establishment of reference genomes and population genomics of native marine animals in Malaysia, specifically sea cucumbers, under the guidance of Prof. Qasim Ayub. Additionally, Cheah's other research interests include eDNA-based monitoring of marine biodiversity and the study of mangrove ecosystems. He is also interested in population genomics of other marine species, such as elasmobranchs, mantis shrimps, and mud crabs.</p>"
  thumbnailUrl: "Cheah.jpg"
