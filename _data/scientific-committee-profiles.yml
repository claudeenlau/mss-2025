 id: 45
 name: "Dr."
 surname: "Faddrine Jang"
 company: "Monash University Malaysia"
 title: "Lecturer, School of Science"
 bio: "Dr. Faddrine Jang is currently a Lecturer at Monash University Malaysia’s School of Science, where she teaches undergraduates on Tropical Environmental Management, Environmental Science, and Ecological Applications. Her research interests include aquatic bio-geochemistry (hydrology and oceanography), environmental monitoring and assessments, environmental pollution (trace metals, microplastics, emerging pollutants), and ecotoxicology. Apart from teaching and research, she is also highly passionate about outreach projects that could help educate the public on environmental awareness and sustainability."
 thumbnailUrl: "FJ.jpg"
