  id: 63
  name: "Mr."
  surname: "Steven JJ Lee"
  company: "Harvist Red Palm Oil"
  title: "Founder and CEO of Harvist Red Palm Oil"
  bio: "Mr. Steven graduated with a Bachelor of Food Science & Technology from the University of Putra Malaysia in 2004. He has 20 years experience in Edible Oil-related process design, project coordination, execution, supervision, and commissioning. He has built more than 40 units of Edible Oil processing plants and traveled to more than 30 countries worldwide to transfer edible oil processing knowledge. He built the First ever Vitamin E extraction and purification plant and successfully commissioned it in 2008 in Kenya, East Africa. In 2018, he built the First Red Palm Oil mild refining integration with a Vitamin E concentration Plant in Malaysia. In 2022, he built the New Version of the Vitamin E Extraction Plant in Sabah, Malaysia."
  thumbnailUrl: "StevenLee.jpg"
