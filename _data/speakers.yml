 id: 61
 name: "Prof."
 surname: "Chong Pei Pei"
 company: "Taylor's University"
 title: "Director of Digital Health and Innovations Impact Lab"
 bio: "Prof. Dr. Chong Pei Pei is currently the Lab Director for the Digital Health and Innovations Impact lab cum the Head of Research at the Faculty of Health and Medical Sciences, Taylor’s University. Upon graduating from the United Kingdom, she began her career as a Post-doctoral Research Fellow in the Department of Microbiology, National University of Singapore. The following year, she returned to Malaysia and served as a lecturer in University Putra Malaysia, following her inner calling to nurture and educate the next generation of biomedical and health sciences practitioners. Over the years, she was successful in securing many research grants from government ministries of education, and science & technology and private organizations such as MAKNA (Malaysian National Cancer Council) totalling more than 2 million cumulatively to realize some of her research initiatives. Several patents were also granted both at national and international level, along with innovative research awards at national level."
 thumbnailUrl: "PeiPei.jpg"
