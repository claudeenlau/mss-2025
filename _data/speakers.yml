  id: 60
  name: "Prof."
  surname: "Chong Pei Pei"
  company: "Taylor's University"
  title: "Director of Digital Health and Innovations Impact Lab"
  bio: "<p>Prof. Dr. Pei Pei Chong received her Ph.D. degree from the University of Manchester Institute of Science and Technology (UMIST), U.K. in the field of Biochemistry and Applied Molecular Biology through a full scholarship. She had graduated with a first-class honours from the same institution with a B.Sc. (Hons), sponsored by the Malaysian government.<br><br>Upon graduation, she worked as a Post-doctoral Research Fellow in the Department of Microbiology, National University of Singapore (NUS). A year later, she began her career as an academic starting with the position of Lecturer in the Faculty of Medicine and Health Sciences, University Putra Malaysia, in Selangor, Malaysia. In 2012, she did her sabbatical research in NUS for 9 months, after which she was appointed as a Visiting Research Associate Professor for a period of 2 years in the Centre for Translational Medicine, Infectious Diseases Group headed by Prof. Dr. Naoki Yamamoto.<br><br>Prof Chong had joined Taylor’s University in 2018 and was appointed as the Head of Research in 2019, and Director of the Digital Health and Medical Advancement Impact Lab in 2022. Prof. Chong has a keen interest in infectious diseases research and has worked extensively on candidiasis and secondarily, on drug-resistant bacteria. She also has a strong track record in research covering the molecular pathogenesis of cancers, especially for the types of cancers which have an etiological link to viruses including HPV in cervical cancer and EBV  in nasopharyngeal cancer. She had managed to obtain several granted patents and received research innovation awards both from her university as well as from international invention exhibitions. Her current research interests include trans-disciplinary research that encompasses multiple fields that include applied microbiology, engineering, IT and biological sciences in the quest for improved healthcare for the universal population.</p>"
  thumbnailUrl: "PeiPei.jpg"
