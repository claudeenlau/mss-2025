 name: "Prof."
 surname: "Leong Chee-Onn"
 company: "AGTC Genomics"
 title: "Founder and CEO of AGTC Genomics"
 bio: "Prof. Dr. Chee-Onn is an experienced cancer biologist. Prior to founding AGTC Genomics, Chee-Onn served as the Deputy Director of Research and Professor at the International Medical University. He was a Senior Research Fellow at the Harvard Medical School and Massachusetts General Hospital. Currently, he is a Fellow of the Institute of Biomedical Sciences (FIBMS, UK), Fellow of the Royal Society of Biology (FRBS, UK), and Fellow of the Royal Society of Chemistry (FRCS, UK)."
