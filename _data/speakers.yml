 name: "Prof."
 surname: "Chong Pei Pei"
 company: "Taylor's University"
 title: "Director of Digital Health and Innovations Impact Lab"
 bio: "<p>Prof. Dr. Chong Pei Pei is currently the Lab Director for the Digital Health and Innovations Impact lab cum the Head of Research at the Faculty of Health and Medical Sciences, Taylor’s University.<br><br>Upon graduating from the United Kingdom, she began her career as a Post-doctoral Research Fellow in the Department of Microbiology, National University of Singapore. The following year, she returned to Malaysia and served as a lecturer in University Putra Malaysia, following her inner calling to nurture and educate the next generation of biomedical and health sciences practitioners. Over the years, she was successful in securing many research grants from government ministries of education, and science & technology and private organizations such as MAKNA (Malaysian National Cancer Council) totalling more than 2 million cumulatively to realize some of her research initiatives. Several patents were also granted both at national and international level, along with innovative research awards at national level.<br><br>Science is forever evolving, and the pace of discovery of new knowledge and development of new technologies is tremendous especially with the advent of the digital era. Hence, since joining Taylor’s University (TU), she began to engage in not only health and medical research but also trans-disciplinary research which adopt state-of-the-art technologies in computer sciences as well as engineering in collaboration with my colleagues from other schools to devise innovative solutions to health problems.<br><br>This is reflected by the number of research grants she won since 2019 after joining TU, whereby she is the project leader of a Fundamental Research Grant (FRGS) and a Prototype Research Grant (PRGS), as well as co-researcher of 7 other FRGS grants from the Ministry of Higher Education. Three of the grants involve multi-disciplinary projects such as Profiling of Pornography Addiction among Children using Neuro-Physiological Computational Model (NCM), Innovating an Improved Cervical Cell Sampling Device via 3D Printing Prototyping, and Developing a Framework for Automated Cancer Cells Detection using Computer Vision and Deep Learning Algorithms.<br><br>In addition to teaching of undergraduate courses, Pei Pei is also a Module Leader for a postgraduate core module known as Research Methods for Science, where she not only imparts basic knowledge on research methodology to Masters and PhD students from biomedical and pharmaceutical sciences, engineering and computer science disciplines, but also instils in them the motivation to do research that will bring impact to humanity.</p>"
