 id: 62
 name: "Prof."
 surname: "Philip J. Marriott"
 company: "Monash University"
 title: "Professor of Chemistry and Deputy Director Australian Centre for Research on Separation Science (ACROSS)"
 bio: "Professor Marriott's career commenced at LaTrobe University, continued at Bristol University, then academic appointments at the National University of Singapore, RMIT University and Monash University. His research includes invention of cryogenic modulation in GC, leading to device development, fundamental principles and a large applications base with primary research in multidimensional GC (MDGC), comprehensive two-dimensional GC (GC×GC), and mass spectrometry.  He applies MDGC and GC×GC to diverse separations including: pesticides; petrochemicals; pharmaceuticals; foods, flavours and beverage analysis; natural products; toxins. He has had visiting appointments in China, South Korea, Brazil, and Malaysia."
