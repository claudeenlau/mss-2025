  id: 61
  name: "Prof."
  surname: "Rina B. Opulencia"
  company: "University of the Philippines Los Baños"
  title: "Institute of Biological Sciences"
  bio: "<p>Dr. Rina B. Opulencia is a professor of microbiology, and molecular and biology and biotechnology at the University of the Philippines Los Baños where she graduated with a BS in Biology. She obtained her Master of Science in Microbiology at University of Queensland, Brisbane, Australia with an Australian scholarship grant, and her PhD in Microbiology at University of Illinois, Urbana-Champaign, USA through a Fulbright-Philippine Agriculture Scholarship.  She is the 2024 Institute of Biological Sciences Outstanding Researcher Award (Senior Category), a recipient of the 2019 Professor William L. Fernandez Award for Excellence in Teaching Microbiology given by the Philippine Society for Microbiology, Inc.,  placed second in the Philippine Talent Search for Young Scientists given by National Academy of Science and Technology, Department of Science and Technology, and conferred the title \"University of the Philippines Scientist I\" for 2020-2022, and 2023-2025, for her scientific productivity.<br><br>Her current research endeavors include microbial diversity of and bioactive compound-producing microorganisms from extreme environments, bioremediation, recombinant antibodies, multidrug resistant pathogens, and genetic basis of multidrug resistance. Her research has thus far resulted in 30 publications in peer-reviewed international journals and several presentations in international scientific meetings.<br><br> She has been teaching undergraduate and graduate courses, and mentoring several undergraduate, Master's and PhD students in Microbiology, and Molecular Biology and Biotechnology.  She instituted graduate courses in microbiology, and authored laboratory manuals in specialized microbiology courses, namely, Microbial Genetics and Phenotypic Techniques in Microbial Identification.<br><br>She is  the Chair of the Graduate Program Management Committee for PhD Microbiology, co-chair of the Graduate Program Management Committee for MS Microbiology , and member of the Graduate Program Management Committee for MS and PhD Molecular Biology and Biotechnology. <br><br>She is currently a member of the editorial board of PLOS One, and has served as reviewer of manuscripts submitted for publication in various peer-reviewed journals, and as technical reviewer of research proposals submitted to Philippine funding agencies. She has also served as a member of technical working groups in biotechnology and in risk analysis of foodborne antimicrobial resistance in the Philippines.<p>"
