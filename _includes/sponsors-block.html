<section id="sponsors" class="sponsors">
  <style>
    .sponsor-row {
      display: grid;
      gap: 30px;
      margin-bottom: 60px;
      align-items: center;
      justify-items: center;
    }

    .sponsor-row.event-organiser {
      grid-template-columns: 1fr;
    }

    .sponsor-row.platinum-sponsors {
      grid-template-columns: repeat(2, 1fr);
    }

    .sponsor-row.gold-sponsors {
      grid-template-columns: 1fr;
    }

    .sponsor-row.copper-sponsors {
      grid-template-columns: repeat(3, 1fr);
    }

    .sponsor-row.value-sponsors {
      grid-template-columns: repeat(2, 1fr);
    }

    .sponsor-card {
      text-align: center;
      padding: 10px;
    }

    .sponsor-card img {
      max-width: 280px;
      height: auto;
      object-fit: contain;
    }

    .sponsor-name {
      font-size: 14px;
      margin-top: 10px;
    }

    .sponsor-group {
      margin-top: 40px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>

  <div class="content-wrapper">
    <h3>{{ site.sponsorsTitle }}</h3>
    <p>{{ site.sponsorsDescription }}</p>

    {% for group in site.sponsorGroups %}
      <h5 class="sponsor-group">{{ group.group }}</h5>

      <div class="sponsor-row {{ group.group | downcase | replace: ' ', '-' }}">
        {% for sponsor in group.elements %}
          <div class="sponsor-card">
            <a href="{{ sponsor.link }}" target="_blank">
              <img src="{{ site.baseurl }}/img/partners/{{ sponsor.logo }}" alt="{{ sponsor.name }}">
            </a>
            <p class="sponsor-name">{{ sponsor.name }}</p>
          </div>
        {% endfor %}
      </div>
    {% endfor %}
  </div>
</section>
